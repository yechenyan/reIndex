spec: pdf-extractor-pdf/job@1.0
source: ../sws_netze_solingen_gmbh_netzausbauplan_2024_pdf.pdf
main: ./main.py
evidence_dir: ./evidence
inventory: ./evidence/inventory.json
reference: ./evidence/reference.json
output_dir: ../output
request: "Extract all tables into project-local output. Header-neutral matrix: inventory freezes positional column_count; result returns column_count plus rows; row 0 ordinary source row; CSV has no separate header. Do not invent column names. Explicitly account continuation duplicate leading rows."
evidence:
  thumbnail_dpi: 72
  contact_columns: 4
  contact_pages: 8
  contact_overlap_pages: 1
  finder_candidate_dpi: 150
  table_dpi: 220
policy:
  scope: full_document
  extractor_timeout_seconds: 120
  require_row_bbox: true
  merge_candidate_threshold: 0.85
  require_independent_agents: true
  require_parallel_extraction_qa: true
