[tool.uv.workspace]
members = ["packages/cli", "packages/server"]

[tool.uv.sources]
reindex-cli = { workspace = true }
reindex-server = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pillow>=12,<13",
    "pypdfium2>=5,<6",
    "pyyaml>=6,<7",
    "pytest>=8,<9",
    "reindex-cli",
    "reindex-server",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
