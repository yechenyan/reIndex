[tool.uv.workspace]
members = ["packages/cli", "packages/server", "packages/pdf-table-5", "packages/pdf-to-markdown", "packages/pdf-parse"]

[tool.uv.sources]
reindex = { workspace = true }
reindex-server = { workspace = true }
pdf-table-5 = { workspace = true }
pdf-to-markdown = { workspace = true }
pdf-parse = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pillow>=12,<13",
    "pypdfium2>=5,<6",
    "pdf-table-5",
    "pdf-to-markdown",
    "pdf-parse",
    "pyyaml>=6,<7",
    "pytest>=8,<9",
    "reindex",
    "reindex-server",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
