[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reindex-cli"
version = "0.1.0"
description = "CLI for building, uploading, and querying ReIndex packages."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pymupdf>=1.26,<2",
]

[project.scripts]
reindex = "reindex_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
