                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/nodes/browse:
    post:
      tags:
      - Collections
      summary: Browse Nodes
      operationId: browse_nodes_v1_nodes_browse_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowseRequest'
        required: true
      responses:
