          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Collection or model state conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request schema validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/pull:
    post:
      tags:
      - Versions
      summary: Pull
      operationId: pull_v1_pull_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCollectionRequest'
        required: true
      responses:
        '200':
          description: Node-only ZIP for the selected Collection version.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: string
            X-ReIndex-Package-Hash:
              schema:
                type: string
            X-ReIndex-Version-ID:
              schema:
                type: string
                format: uuid
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Collection or model state conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request schema validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/get:
    post:
      tags:
      - Resources
      summary: Get Resource
      operationId: get_resource_v1_get_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRequest'
        required: true
      responses:
        '200':
          description: Exact resource bytes. Content-Type is the stored resource media type.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-ReIndex-SHA256:
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Collection or model state conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request schema validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/search:
    post:
      tags:
      - Search
      summary: Search
      operationId: search_v1_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchApiResponse'
        '400':
          description: Invalid request or cursor.
          content:
            application/json:
              schema:
