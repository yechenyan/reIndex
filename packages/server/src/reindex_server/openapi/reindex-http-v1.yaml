  /v1/grep:
    post:
      tags:
      - Search
      summary: Grep
      operationId: grep_v1_grep_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrepRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchApiResponse'
        '400':
