[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reindex-server"
version = "0.1.0"
description = "Backend service for storing and querying ReIndex packages."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.136,<1",
    "uvicorn>=0.47,<1",
]

[project.scripts]
reindex-server = "reindex_server.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
