[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-table-codegen"
version = "0.2.0"
description = "Agent-oriented tools for generating reusable, PDF-specific table extractors."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pillow>=12,<13",
    "pymupdf>=1.26,<2",
    "pyyaml>=6,<7",
]

[project.scripts]
pdf-table-codegen = "pdf_table_codegen.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_table_codegen = [
    "bundled_skill/pdf-table-codegen/SKILL.md",
    "bundled_skill/pdf-table-codegen/agents/openai.yaml",
    "bundled_skill/pdf-table-codegen/references/*.md",
]
