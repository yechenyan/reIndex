[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-extractor-pdf"
version = "0.1.0"
description = "Agent-guided workflow for generating deterministic, PDF-specific table extractors."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pillow>=12,<13",
    "pymupdf>=1.26,<2",
    "pyyaml>=6,<7",
]

[project.scripts]
pdf-extractor-pdf = "pdf_extractor_pdf.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_extractor_pdf = [
    "bundled_skill/pdf-extractor-pdf/SKILL.md",
    "bundled_skill/pdf-extractor-pdf/agents/openai.yaml",
    "bundled_skill/pdf-extractor-pdf/references/*.md",
]
