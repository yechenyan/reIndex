[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-to-markdown"
version = "0.1.0"
description = "LiteParse-first PDF to Markdown with verified table fallback"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "liteparse>=2.11.1,<3",
    "pillow>=12,<13",
    "pymupdf>=1.26,<2",
    "pdf-table-5",
]

[project.scripts]
pdf-to-markdown = "pdf_to_markdown.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_markdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
